# Entorno de prueba local (p. ej. en Kali): app Node + MySQL.
#   docker compose up --build
#   → sitio:  http://localhost:3000
#   → panel:  http://localhost:3000/admin   (admin / admin12345)
#
# Las migraciones y el seed corren solas al arrancar (migrationsRun: true), así
# que el blog, servicios y planes aparecen sin pasos manuales.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trycatch_db
    ports:
      - "3307:3306"   # host 3307 para no chocar con un MySQL/MariaDB local en Kali
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # espera a que MySQL acepte conexiones
    environment:
      # development: sobre http://localhost evita el upgrade-insecure-requests de
      # la CSP de producción (que rompería CSS/JS al forzar https).
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: trycatch_db
      # Usuario admin inicial (se siembra si la tabla users está vacía).
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin12345
      SESSION_SECRET: dev-session-secret-cambia-esto-0123456789
      CONTACT_EMAIL: contacto@trycatchgt.org
      WHATSAPP_NUMBER: "50200000000"
    ports:
      - "3000:3000"

volumes:
  db_data:
